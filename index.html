<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictador de Taquigrafía - Marilú</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196F3">
    <!-- Librería PDF.js para leer los PDFs directo en el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; color: #333; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .header { display: flex; align-items: center; gap: 12px; }
        .header img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .header h2 { font-size: 16px; margin: 0; }
        .header p { font-size: 12px; color: #666; margin: 2px 0 0 0; }
        button { background: #2196F3; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 8px; }
        button.stop { background: #f44336; }
        button.reset { background: #FF9800; }
        button.view-text { background: #673AB7; } /* Botón violeta para ver el texto */
        .stats { text-align: center; font-size: 16px; font-weight: bold; margin: 10px 0; }
        .word-box { background: #e3f2fd; padding: 10px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; color: #1565c0; min-height: 24px; }
        .range-container { margin: 10px 0; }
        input[type=range] { width: 100%; }
        input[type=file] { width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px; margin-top: 5px; }
        
        .text-preview {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: #fdfbf7;
            border: 1px solid #ccc;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="card header">
        <img src="mi_foto.jpg" alt="Foto">
        <div>
            <h2>Rubén Alberto Ramírez</h2>
            <p>Dictador de Taquigrafía (LU8WRA)</p>
        </div>
    </div>

    <div class="card">
        <label><strong>📁 Seleccionar PDF de WhatsApp:</strong></label>
        <input type="file" id="inputPdf" accept=".pdf" onchange="cargarPdfMovil(event)">
    </div>

    <div class="card">
        <div class="range-container">
            <label id="lblVelocidad">Velocidad: 75 PPM</label>
            <input type="range" id="rangeVelocidad" min="60" max="180" value="75" oninput="actualizarVelocidad(this.value)">
        </div>

        <div class="stats">
            <div id="lblPalabras">Palabras leídas: 0 / 0</div>
            <div id="lblTiempo">Tiempo: 00:00</div>
        </div>

        <label style="font-size: 12px; color: #666;">Palabra actual:</label>
        <div class="word-box" id="palabraActual">-</div>

        <button onclick="iniciarLectura()" style="background: #4CAF50;">▶ Reproducir</button>
        <button class="stop" onclick="detenerLectura()">⏹ Detener</button>
        <button class="view-text" onclick="mostrarTextoCargado()">📄 Ver Texto Completo</button>
        <button class="reset" onclick="puestaEnCero()">🔄 Puesta en Cero</button>

        <div class="text-preview" id="boxTextoCompleto"></div>
    </div>

<script src="app.js"></script>
</body>
</html>
